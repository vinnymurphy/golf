{% extends "base.html" %}
{% block content %}
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Start a New Round</h3>
            </div>
            <div class="card-body">
                <form method="get"
                      id="start-round-form"
                      data-scorecard-url-template="{% url 'scoring:enter_scorecard' course_id=0 %}">
                    <div class="mb-3">
                        <label for="id_course" class="form-label font-weight-bold">Select Course</label>
                        <select name="course" id="id_course" class="form-select" required>
                            <option value="">Select a course</option>
                            {% for course in courses %}
                                <option value="{{ course.id }}">{{ course.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg">Enter Scorecard</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("start-round-form").addEventListener("submit", function () {
            const courseId = document.getElementById("id_course").value;
            this.action = this.dataset.scorecardUrlTemplate.replace("/0/", `/${courseId}/`);
        });
    </script>
{% endblock %}
